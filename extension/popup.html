<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Text Extractor</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 360px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        cursor: pointer;
        margin-top: 8px;
      }
      button:first-of-type {
        margin-top: 0;
      }
      label {
        display: block;
        font-size: 12px;
        margin-top: 8px;
      }
      input[type="number"] {
        width: 100%;
        padding: 6px 8px;
        box-sizing: border-box;
        font-size: 12px;
        margin-top: 4px;
      }
      textarea {
        width: 100%;
        height: 180px;
        margin-top: 8px;
        box-sizing: border-box;
        font-size: 12px;
        resize: vertical;
      }
      .meta {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>TypeRacer Bot</h1>
    <button id="extract">Extract text from page</button>
    <label for="wpm">Speed (WPM)</label>
    <input type="number" id="wpm" min="50" max="200" value="100" step="1" />
    <button id="start">Start</button>
    <textarea id="output" readonly placeholder="Extracted text appears here…"></textarea>
    <div id="meta" class="meta"></div>
    <script src="popup.js"></script>
  </body>
</html>
